<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JobPrep Admin — Question 31 of 50 on phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#2D62CF}a:hover{color:#1E4BA8}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #6AA6EE;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; min-height: 1500px; display: flex; flex-direction: column; background: #EFF3F8; font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; color: #3A3F4A">
  <header style="flex: 0 0 auto; background: #FFFFFF; border-bottom: 1px solid #E2E7EF; padding: 8px 16px 10px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 10px; min-height: 44px">
      <a href="AdminOverviewPhone.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -12px; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; color: #3A3F4A; font-size: 20px">←</a>
      <h1 style="margin: 0; font-size: 19px; flex: 1 1 auto">Question 31 of 50</h1>
      <span style="font-size: 11px; font-weight: 600; padding: 3px 7px; border-radius: 6px; background: #164A7A; color: #FFFFFF">ADMIN</span>
    </div>
  </header>
  <main style="flex: 1 1 auto; padding: 14px 16px 20px; display: flex; flex-direction: column; gap: 14px">
    <span style="font-size: 13px; color: #5E6573; font-weight: 600">Secondary Mathematics (S1–S3) — Mock 1 · Free · Published</span>
    <div role="note" style="background: #FDF1DD; border: 1px solid #E9CF9B; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 4px">
      <span style="font-weight: 600; font-size: 14px; color: #8A5300">Reported by 2 candidates</span>
      <span style="font-size: 14px; color: #8A5300">“Option D ‘7.5 and 8’ is confusing.”</span>
    </div>
    <label style="display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 14px">Question
      <textarea rows="3" style="font: inherit; font-weight: 400; font-size: 16px; border: 1px solid #CDD4DE; border-radius: 10px; padding: 10px 12px; color: #3A3F4A">The median of 3, 8, 5, 12, 7 and 10 is…</textarea>
    </label>
    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-weight: 600; font-size: 14px; padding: 0; margin-bottom: 8px">Options — tap the circle for the correct one</legend>
      <sc-for list="{{opts}}" as="o" hint-placeholder-count="4">
        <div style="display: flex; gap: 8px; align-items: center">
          <input type="radio" name="c" checked="{{o.right}}" aria-label="Mark option {{o.key}} correct" style="width: 22px; height: 22px; accent-color: #1E7A46">
          <span style="width: 20px; font-weight: 600; color: #3A3F4A">{{o.key}}</span>
          <input type="text" value="{{o.text}}" aria-label="Option {{o.key}}" style="flex: 1 1 auto; min-width: 0; height: 46px; border: {{o.border}}; border-radius: 10px; padding: 0 12px; font: inherit; font-size: 16px; background: {{o.bg}}; color: #3A3F4A">
        </div>
      </sc-for>
    </fieldset>
    <label style="display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 14px">Explanation
      <textarea rows="4" style="font: inherit; font-weight: 400; font-size: 15px; line-height: 1.5; border: 1px solid #CDD4DE; border-radius: 10px; padding: 10px 12px; color: #3A3F4A">Order the data: 3, 5, 7, 8, 10, 12. With an even number of values, the median is the mean of the two middle values: (7 + 8) ÷ 2 = 7.5.</textarea>
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 14px">Topic
      <select style="height: 46px; border: 1px solid #CDD4DE; border-radius: 10px; padding: 0 12px; font: inherit; font-weight: 400; font-size: 16px; color: #3A3F4A; background: #FFFFFF"><option>Statistics &amp; probability</option></select>
    </label>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <label style="display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 14px">Difficulty<select style="height: 46px; border: 1px solid #CDD4DE; border-radius: 10px; padding: 0 12px; font: inherit; font-weight: 400; font-size: 16px; color: #3A3F4A; background: #FFFFFF"><option>Standard</option></select></label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 14px">Marks<input type="number" value="1" style="height: 46px; border: 1px solid #CDD4DE; border-radius: 10px; padding: 0 12px; font: inherit; font-weight: 400; font-size: 16px; color: #3A3F4A; background: #FFFFFF"></label>
    </div>
    <p style="margin: 0; font-size: 13px; color: #5E6573">1,204 attempts · 41% answered correctly</p>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <button type="button" style="font: inherit; font-weight: 600; font-size: 16px; min-height: 48px; border-radius: 10px; border: 0; background: #164A7A; color: #FFFFFF">Publish &amp; resolve reports</button>
      <button type="button" style="font: inherit; font-weight: 600; font-size: 15px; min-height: 48px; border-radius: 10px; border: 1px solid #CDD4DE; background: #FFFFFF; color: #3A3F4A">Save draft</button>
    </div>
  </main>
  <nav aria-label="Admin" style="flex: 0 0 auto; position: sticky; bottom: 0; background: #FFFFFF; border-top: 1px solid #E2E7EF; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 4px 2px 8px">
    <a href="AdminOverviewPhone.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #5E6573; font-size: 11px; font-weight: 600; padding: 6px 0; min-height: 48px"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h8V3H3z M13 21h8V11h-8z M3 21h8v-6H3z M13 9h8V3h-8z"></path></svg>Overview</a>
    <a href="AdminUsersPhone.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #5E6573; font-size: 11px; font-weight: 600; padding: 6px 0; min-height: 48px"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M22 21v-2a4 4 0 0 0-3-3.9"></path></svg>Users</a>
    <a href="AdminExamsPhone.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #164A7A; font-size: 11px; font-weight: 600; padding: 6px 0; min-height: 48px"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6v3H9z M7 5H5v16h14V5h-2 M8 11h8 M8 15h5"></path></svg>Exams</a>
    <a href="AdminPaymentsPhone.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #5E6573; font-size: 11px; font-weight: 600; padding: 6px 0; min-height: 48px"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18v13H3z M3 10h18"></path></svg>Payments</a>
    <a href="AdminSettingsPhone.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #5E6573; font-size: 11px; font-weight: 600; padding: 6px 0; min-height: 48px"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M12 2v3 M12 19v3 M4.2 4.2l2.1 2.1 M17.7 17.7l2.1 2.1 M2 12h3 M19 12h3 M4.2 19.8l2.1-2.1 M17.7 6.3l2.1-2.1"></path></svg>Settings</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this, st = this.state || {};
    return { opts: [['A', '7', false], ['B', '7.5', true], ['C', '8', false], ['D', '7.5 and 8', false]].map(function (o) {
      return { key: o[0], text: o[1], right: o[2], border: o[2] ? '2px solid #1E7A46' : '1px solid #CDD4DE', bg: o[2] ? '#E3F4E8' : '#FFFFFF' };
    }) };
  }
}
</script>
</body>
</html>
