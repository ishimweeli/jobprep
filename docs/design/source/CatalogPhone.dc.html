<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JobPrep — Find a mock test on phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#6D28D9}a:hover{color:#5B21B6}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #A78BFA;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #FAFAFA; font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; color: #18181B">
  <header style="flex: 0 0 auto; background: #FFFFFF; border-bottom: 1px solid #E4E4E7; padding: 8px 16px 12px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 4px">
      <a href="MainPhone.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; margin-left: -12px; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; color: #18181B; font-size: 20px">←</a>
      <h1 style="margin: 0; font-size: 19px">Find your mock test</h1>
    </div>
    <div role="search" style="display: flex; gap: 8px">
      <label for="pc-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search job title or subject</label>
      <input id="pc-q" type="search" value="{{query}}" onInput="{{onQuery}}" placeholder="Job title or subject" style="flex: 1 1 auto; min-width: 0; height: 48px; border: 1px solid #A1A1AA; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 16px; color: #18181B; background: #FFFFFF">
      <button type="button" onClick="{{openFilters}}" style="flex: 0 0 auto; font: inherit; font-weight: 600; font-size: 15px; height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #A1A1AA; background: #FFFFFF; color: #18181B; display: inline-flex; align-items: center; gap: 6px">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16 M7 12h10 M10 18h4"></path></svg>
        Filters{{filterBadge}}
      </button>
    </div>
    <div role="group" aria-label="Job category" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 2px">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
        <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="flex: 0 0 auto; font: inherit; font-size: 14px; font-weight: 600; min-height: 40px; padding: 0 14px; border-radius: 999px; border: {{c.border}}; background: {{c.bg}}; color: {{c.ink}}">{{c.label}}</button>
      </sc-for>
    </div>
  </header>

  <main aria-live="polite" style="flex: 1 1 auto; overflow-y: auto; padding: 14px 16px 20px; display: flex; flex-direction: column; gap: 12px">
    <p style="margin: 0; font-size: 14px; color: #3F3F46; font-weight: 600">{{countLabel}}</p>
    <sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
      <div style="background: #FFFFFF; border: 1px dashed #A1A1AA; border-radius: 14px; padding: 24px 16px; text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center">
        <p style="margin: 0; font-weight: 700; font-size: 16px">No mock tests match yet</p>
        <p style="margin: 0; font-size: 14px; color: #3F3F46">Try a broader job title, or request this exam.</p>
        <button type="button" onClick="{{clear}}" style="font: inherit; font-weight: 600; font-size: 15px; min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid #6D28D9; background: #FFFFFF; color: #6D28D9">Clear search</button>
      </div>
    </sc-if>
    <sc-for list="{{results}}" as="e" hint-placeholder-count="4">
      <a href="ExamDetailPhone.dc.html" style="background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: #18181B">
        <span style="display: flex; justify-content: space-between; gap: 8px; align-items: center">
          <span style="font-size: 12px; font-weight: 600; color: #52525B">{{e.cat}}</span>
          <span style="font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: {{e.tagBg}}; color: {{e.tagInk}}">{{e.tag}}</span>
        </span>
        <span style="font-weight: 700; font-size: 16px; line-height: 1.35">{{e.title}}</span>
        <span style="font-size: 13px; color: #3F3F46">{{e.q}} questions · {{e.min}} min · {{e.lang}} · {{e.diff}}</span>
      </a>
    </sc-for>
  </main>

  <sc-if value="{{showFilters}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: rgba(24,24,27,0.5); display: flex; flex-direction: column; justify-content: flex-end">
      <div role="dialog" aria-modal="true" aria-labelledby="flt" style="background: #FFFFFF; border-radius: 20px 20px 0 0; padding: 18px 16px 20px; display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; justify-content: space-between; align-items: center">
          <h2 id="flt" style="margin: 0; font-size: 18px">Filters</h2>
          <button type="button" onClick="{{reset}}" style="font: inherit; font-weight: 600; font-size: 15px; min-height: 44px; padding: 0 8px; border: 0; background: transparent; color: #6D28D9">Reset</button>
        </div>
        <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
          <legend style="font-weight: 700; font-size: 15px; padding: 0; margin-bottom: 8px">Price</legend>
          <div style="display: flex; gap: 8px">
            <sc-for list="{{prices}}" as="p" hint-placeholder-count="3">
              <button type="button" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" style="flex: 1 1 0; font: inherit; font-size: 14px; font-weight: 600; min-height: 44px; border-radius: 10px; border: {{p.border}}; background: {{p.bg}}; color: {{p.ink}}">{{p.label}}</button>
            </sc-for>
          </div>
        </fieldset>
        <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px">
          <legend style="font-weight: 700; font-size: 15px; padding: 0; margin-bottom: 8px">Difficulty</legend>
          <label style="display: flex; gap: 10px; align-items: center; font-size: 15px; min-height: 40px"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #6D28D9"> Foundation</label>
          <label style="display: flex; gap: 10px; align-items: center; font-size: 15px; min-height: 40px"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #6D28D9"> Standard</label>
          <label style="display: flex; gap: 10px; align-items: center; font-size: 15px; min-height: 40px"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #6D28D9"> Challenging</label>
        </fieldset>
        <button type="button" onClick="{{closeFilters}}" style="font: inherit; font-weight: 700; font-size: 16px; min-height: 52px; border-radius: 12px; border: 0; background: #6D28D9; color: #FFFFFF">Show {{count}} results</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { query: '', cat: 'Teaching', price: 'All', sheet: false }; }
  renderVals() {
    var self = this, s = this.state;
    var exams = [
      { cat: 'Teaching', title: 'Secondary Mathematics Teacher (S1–S3) — Mock 1', q: 50, min: 60, lang: 'EN', diff: 'Standard', free: true },
      { cat: 'Teaching', title: 'Secondary Mathematics Teacher (S4–S6) — Mock 1', q: 50, min: 60, lang: 'EN', diff: 'Challenging', free: false },
      { cat: 'Teaching', title: 'Primary Teacher — General (P1–P6) Mock 1', q: 60, min: 75, lang: 'EN · KIN', diff: 'Foundation', free: true },
      { cat: 'Teaching', title: 'Teaching Profession & CBC Pedagogy', q: 40, min: 45, lang: 'EN · KIN', diff: 'Standard', free: false },
      { cat: 'Leadership', title: 'Headteacher — School Leadership Mock 1', q: 40, min: 60, lang: 'EN · KIN', diff: 'Standard', free: true },
      { cat: 'Government', title: 'Executive Secretary (Cell) — Mock 2', q: 50, min: 60, lang: 'EN · KIN', diff: 'Standard', free: false },
      { cat: 'Finance', title: 'Accountant (Public Institution) — Mock 1', q: 45, min: 90, lang: 'EN', diff: 'Standard', free: false },
      { cat: 'Finance', title: 'Accountant — Free Sample (15 questions)', q: 15, min: 20, lang: 'EN', diff: 'Foundation', free: true },
      { cat: 'Procurement', title: 'Procurement Officer — Mock 1', q: 45, min: 60, lang: 'EN', diff: 'Standard', free: false }
    ];
    var q = (s.query || '').toLowerCase().trim();
    var results = exams.filter(function (e) {
      if (q) { if (e.title.toLowerCase().indexOf(q) < 0 && e.cat.toLowerCase().indexOf(q) < 0) return false; }
      else if (s.cat !== 'All' && e.cat !== s.cat) return false;
      if (s.price === 'Free' && !e.free) return false;
      if (s.price === 'Package' && e.free) return false;
      return true;
    }).map(function (e) {
      return Object.assign({}, e, e.free ? { tag: 'Free', tagBg: '#D1FAE5', tagInk: '#065F46' } : { tag: 'Full Access', tagBg: '#F4F4F5', tagInk: '#3F3F46' });
    });
    var cats = ['All', 'Teaching', 'Leadership', 'Government', 'Finance', 'Procurement', 'Other'].map(function (n) {
      var on = !q && s.cat === n;
      return { label: n, pressed: on ? 'true' : 'false', border: on ? '1px solid #6D28D9' : '1px solid #D4D4D8', bg: on ? '#6D28D9' : '#FFFFFF', ink: on ? '#FFFFFF' : '#18181B',
        pick: function () { self.setState({ cat: n, query: '' }); } };
    });
    var prices = [['All', 'All'], ['Free', 'Free'], ['Package', 'Full Access']].map(function (p) {
      var on = s.price === p[0];
      return { label: p[1], pressed: on ? 'true' : 'false', border: on ? '1px solid #6D28D9' : '1px solid #D4D4D8', bg: on ? '#F5F3FF' : '#FFFFFF', ink: on ? '#5B21B6' : '#18181B',
        pick: function () { self.setState({ price: p[0] }); } };
    });
    return {
      query: s.query, cats: cats, prices: prices, results: results, count: results.length,
      isEmpty: results.length === 0,
      countLabel: results.length + (results.length === 1 ? ' mock test' : ' mock tests'),
      filterBadge: s.price === 'All' ? '' : ' (1)',
      showFilters: s.sheet,
      onQuery: function (e) { self.setState({ query: e.target.value }); },
      clear: function () { self.setState({ query: '' }); },
      openFilters: function () { self.setState({ sheet: true }); },
      closeFilters: function () { self.setState({ sheet: false }); },
      reset: function () { self.setState({ price: 'All' }); }
    };
  }
}
</script>
</body>
</html>
