<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JobPrep Admin — Settings on phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#2D62CF}a:hover{color:#1E4BA8}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #6AA6EE;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; min-height: 1300px; display: flex; flex-direction: column; background: #EFF3F8; font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; color: #3A3F4A">
  <header style="flex: 0 0 auto; background: #FFFFFF; border-bottom: 1px solid #E2E7EF; padding: 8px 16px 10px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 10px; min-height: 44px">
      <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#164A7A"></rect><path d="M9 16.5l4.5 4.5L23 11" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <h1 style="margin: 0; font-size: 19px; flex: 1 1 auto">Settings</h1>
      <span style="font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 6px; background: #182231; color: #FFFFFF">ADMIN</span>
    </div>
  </header>
  <main style="flex: 1 1 auto; padding: 14px 16px 20px; display: flex; flex-direction: column; gap: 14px">
    <section aria-labelledby="sp-plan" style="background: #FFFFFF; border: 1px solid #E2E7EF; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <h2 id="sp-plan" style="margin: 0; font-size: 17px">Full Access plan · Rwanda</h2>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <label style="display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 14px">Price (RWF)<input type="number" value="2000" style="height: 46px; border: 1px solid #CDD4DE; border-radius: 10px; padding: 0 12px; font: inherit; font-weight: 400; font-size: 16px; color: #3A3F4A; background: #FFFFFF"></label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 14px">Days<input type="number" value="30" style="height: 46px; border: 1px solid #CDD4DE; border-radius: 10px; padding: 0 12px; font: inherit; font-weight: 400; font-size: 16px; color: #3A3F4A; background: #FFFFFF"></label>
      </div>
      <label style="display: flex; gap: 10px; align-items: center; font-size: 15px; min-height: 40px"><input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #164A7A; flex: 0 0 auto"> Covers every mock test</label>
      <label style="display: flex; gap: 10px; align-items: center; font-size: 15px; min-height: 40px"><input type="checkbox" style="width: 22px; height: 22px; accent-color: #164A7A; flex: 0 0 auto"> Auto-renew (off)</label>
      <button type="button" style="font: inherit; font-weight: 700; font-size: 16px; min-height: 48px; border-radius: 12px; border: 0; background: #164A7A; color: #FFFFFF">Save plan</button>
    </section>
    <section aria-labelledby="sp-pay" style="background: #FFFFFF; border: 1px solid #E2E7EF; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <h2 id="sp-pay" style="margin: 0; font-size: 17px">Payment providers</h2>
      <div style="display: flex; align-items: center; gap: 10px"><span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 7px; background: #FFCB05"></span><span style="flex: 1 1 auto; font-weight: 600">MTN MoMo</span><span style="font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: #E3F4E8; color: #1E6B3C">Live</span></div>
      <div style="display: flex; align-items: center; gap: 10px"><span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 7px; background: #E40000"></span><span style="flex: 1 1 auto; font-weight: 600">Airtel Money</span><span style="font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: #E3F4E8; color: #1E6B3C">Live</span></div>
    </section>
    <section aria-labelledby="sp-free" style="background: #FFFFFF; border: 1px solid #E2E7EF; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <h2 id="sp-free" style="margin: 0; font-size: 17px">Free access</h2>
      <label style="display: flex; gap: 10px; align-items: center; font-size: 15px; min-height: 40px"><input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #164A7A; flex: 0 0 auto"> Free samples without an account</label>
      <label style="display: flex; gap: 10px; align-items: center; font-size: 15px; min-height: 40px"><input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #164A7A; flex: 0 0 auto"> Explanations on free results</label>
    </section>
    <section aria-labelledby="sp-team" style="background: #FFFFFF; border: 1px solid #E2E7EF; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <h2 id="sp-team" style="margin: 0; font-size: 17px">Admin team</h2>
      <sc-for list="{{team}}" as="t" hint-placeholder-count="4">
        <div style="display: flex; justify-content: space-between; gap: 10px; align-items: center"><span style="font-weight: 600; font-size: 15px">{{t.name}}</span><span style="font-size: 13px; color: #3A3F4A">{{t.role}}</span></div>
      </sc-for>
      <button type="button" style="font: inherit; font-weight: 600; font-size: 15px; min-height: 44px; border-radius: 12px; border: 1px solid #164A7A; background: #FFFFFF; color: #164A7A">Invite admin</button>
    </section>
    <a href="AdminCountriesPhone.dc.html" style="display: flex; justify-content: space-between; align-items: center; background: #FFFFFF; border: 1px solid #E2E7EF; border-radius: 14px; padding: 16px; text-decoration: none; color: #3A3F4A"><span style="display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 16px">Countries</span><span style="font-size: 13px; color: #5E6573">1 live · 1 preparing · 2 planned</span></span><span aria-hidden="true">›</span></a>
    <a href="AdminSettings.dc.html" style="text-align: center; font-weight: 600; font-size: 15px; padding: 12px">Audit log</a>
  </main>
  <nav aria-label="Admin" style="flex: 0 0 auto; position: sticky; bottom: 0; background: #FFFFFF; border-top: 1px solid #E2E7EF; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 4px 2px 8px">
    <a href="AdminOverviewPhone.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #5E6573; font-size: 11px; font-weight: 600; padding: 6px 0; min-height: 52px"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h8V3H3z M13 21h8V11h-8z M3 21h8v-6H3z M13 9h8V3h-8z"></path></svg>Overview</a>
    <a href="AdminUsersPhone.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #5E6573; font-size: 11px; font-weight: 600; padding: 6px 0; min-height: 52px"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M22 21v-2a4 4 0 0 0-3-3.9"></path></svg>Users</a>
    <a href="AdminExamsPhone.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #5E6573; font-size: 11px; font-weight: 600; padding: 6px 0; min-height: 52px"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6v3H9z M7 5H5v16h14V5h-2 M8 11h8 M8 15h5"></path></svg>Exams</a>
    <a href="AdminPaymentsPhone.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #5E6573; font-size: 11px; font-weight: 600; padding: 6px 0; min-height: 52px"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18v13H3z M3 10h18"></path></svg>Payments</a>
    <a href="AdminSettingsPhone.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #164A7A; font-size: 11px; font-weight: 700; padding: 6px 0; min-height: 52px"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M12 2v3 M12 19v3 M4.2 4.2l2.1 2.1 M17.7 17.7l2.1 2.1 M2 12h3 M19 12h3 M4.2 19.8l2.1-2.1 M17.7 6.3l2.1-2.1"></path></svg>Settings</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this, st = this.state || {};
    return { team: [{ name: 'Jean Bosco N.', role: 'System admin' }, { name: 'Marie Claire U.', role: 'Content editor' }, { name: 'Theogene M.', role: 'Content editor' }, { name: 'Sandrine K.', role: 'Support' }] };
  }
}
</script>
</body>
</html>
