<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JobPrep — Setup: country</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2D62CF}a:hover{color:#1E4BA8}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #6AA6EE;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; min-height: 844px; background: #EFF3F8; font-family: Inter, system-ui, sans-serif; color: #3A3F4A; box-sizing: border-box; padding: 20px 20px 32px; display: flex; flex-direction: column; gap: 28px; position: relative"><a href="MainPhone.dc.html" style="display: inline-flex; align-items: center; gap: 10px; text-decoration: none; align-self: flex-start"><span style="width: 36px; height: 36px; border-radius: 10px; background: #164A7A; display: flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span style="font-size: 19px; font-weight: 700; color: #164A7A">JobPrep</span></a><main style="display: flex; flex-direction: column; gap: 20px"><div aria-label="Step 1 of 3" style="display: flex; gap: 6px"><span style="width: 24px; height: 8px; border-radius: 4px; background: #2D62CF"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #CDD4DE"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #CDD4DE"></span></div><div style="display: flex; flex-direction: column; gap: 8px"><h1 style="margin: 0; font-size: 30px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em">Where are you sitting your exam?</h1><p style="margin: 0; font-size: 16px; line-height: 1.5; color: #5E6573">We’ll show your country’s mock tests, prices and payment methods. Everything you see will be for this country.</p></div><div style="position: relative; width: 100%"><label for="oc" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search countries</label><span style="position: absolute; left: 12px; top: 16px; color: #5E6573"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></span><input id="oc" type="search" placeholder="Search countries" style="width: 100%; box-sizing: border-box; height: 48px; border: 1px solid #CDD4DE; border-radius: 10px; padding: 0 12px 0 36px; font: 400 15px Inter, system-ui, sans-serif; color: #3A3F4A; background: #fff"></div><div role="radiogroup" aria-label="Country" style="background: #fff; border: 1px solid #E2E7EF; border-radius: 14px; overflow: hidden">
  <sc-for list="{{items}}" as="c" hint-placeholder-count="5">
    <button type="button" role="radio" aria-checked="{{c.checked}}" aria-disabled="{{c.dis}}" onClick="{{c.pick}}" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 0; border-top: {{c.top}}; background: {{c.bg}}; font-family: inherit; color: #3A3F4A; text-align: left; min-height: 56px; width: 100%; cursor: pointer; opacity: {{c.op}}">
      <span style="width: 34px; height: 26px; border-radius: 6px; background: #EFF3F8; border: 1px solid #E2E7EF; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #5E6573; flex: none">{{c.code}}</span>
      <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 600">{{c.name}}</span><span style="font-size: 13px; color: {{c.metaInk}}">{{c.meta}}</span></span>
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2D62CF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="opacity: {{c.tick}}"><path d="M20 6L9 17l-5-5"></path></svg>
    </button>
  </sc-for>
</div><a href="OnboardCategoryPhone.dc.html" style="width: 100%; justify-content: center; height: 50px; padding: 0 14px; border-radius: 12px; background: #164A7A; color: #fff; border: 0; font: 600 16px Inter, system-ui, sans-serif; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; text-decoration: none; box-sizing: border-box; cursor: pointer">Continue</a><p style="margin: 0; text-align: center; font-size: 14px; color: #5E6573">Not listed? <a href="#" style="text-decoration: none">Tell us your country</a>.</p></main></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this, st = this.state || {}, p = this.props;
    var DATA = [["RW","Rwanda","Suggested · 90 mock tests · RWF",1,0],["KE","Kenya","24 mock tests · KES",0,0],["UG","Uganda","Coming soon",0,1],["TZ","Tanzania","Coming soon",0,1]];
    var sel = st.sel !== undefined ? st.sel : 0;
    var items = DATA.map(function (d, i) {
      var on = i === sel;
      return { code: d[0], name: d[1], meta: d[2], metaInk: d[3] ? '#1E6B3C' : '#5E6573', dis: d[4] ? 'true' : 'false', op: d[4] ? '0.55' : '1',
        checked: on ? 'true' : 'false', bg: on ? '#E8EFFB' : '#fff', top: i === 0 ? '0' : '1px solid #EEF1F5', tick: on ? '1' : '0',
        pick: function () { if (!d[4]) self.setState({ sel: i }); } };
    });
    return { items: items };
  }
}
</script>
</body>
</html>
