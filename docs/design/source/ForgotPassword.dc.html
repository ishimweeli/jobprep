<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JobPrep — Forgot password</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2D62CF}a:hover{color:#1E4BA8}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #6AA6EE;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 900px; background: #EFF3F8; font-family: Inter, system-ui, sans-serif; color: #3A3F4A; box-sizing: border-box; padding: 20px 24px 64px; position: relative"><div style="display: flex; justify-content: space-between; align-items: center; gap: 12px"><a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 10px; text-decoration: none; align-self: flex-start"><span style="width: 34px; height: 34px; border-radius: 9px; background: #164A7A; display: flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span style="font-size: 18px; font-weight: 700; color: #164A7A">JobPrep</span></a><a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 4px; font-size: 15px; font-weight: 500; text-decoration: none"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>Back to home</a></div><main style="max-width: 448px; margin: 48px auto 0; display: flex; flex-direction: column; gap: 22px"><div style="display: flex; flex-direction: column; gap: 8px"><a href="SignIn.dc.html" style="display: inline-flex; align-items: center; gap: 6px; font-size: 16px; text-decoration: none; align-self: flex-start; min-height: 32px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>Back</a><h1 style="margin: 0; font-size: 34px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em">Reset your password</h1><p style="margin: 0; font-size: 16px; line-height: 1.5; color: #5E6573">Enter your email and we’ll send you a link.</p></div><sc-if value="{{form}}" hint-placeholder-val="{{ true }}"><div style="background: #fff; border: 1px solid #E2E7EF; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 16px"><div style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><label for="fp" style="font-size: 14px; font-weight: 600">Email</label><input id="fp" type="email" placeholder="name@example.com" style="height: 48px; border: 1px solid #CDD4DE; border-radius: 12px; padding: 0 14px; font: 400 16px Inter, system-ui, sans-serif; color: #3A3F4A; box-sizing: border-box; width: 100%; min-width: 0; background: #fff"></div><button type="button" onClick="{{send}}" style="width: 100%; justify-content: center; height: 50px; padding: 0 14px; border-radius: 12px; background: #164A7A; color: #fff; border: 0; font: 600 16px Inter, system-ui, sans-serif; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; text-decoration: none; box-sizing: border-box; cursor: pointer">Send reset link</button></div></sc-if><sc-if value="{{sent}}" hint-placeholder-val="{{ false }}"><div role="status" style="background: #E3F4E8; border: 1px solid #BFE3CB; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; color: #1E6B3C"><strong style="font-size: 16px">Check your email</strong><span style="font-size: 15px; line-height: 1.5">If an account exists for that address, a reset link is on its way. It works for 1 hour.</span></div><div style="display: flex; justify-content: center"><a href="SignIn.dc.html" style="height: 44px; padding: 0 14px; border-radius: 10px; color: #2D62CF; font: 600 14px Inter, system-ui, sans-serif; display: inline-flex; align-items: center; text-decoration: none">Back to sign in</a></div></sc-if></main></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state": {"editor": "enum", "options": ["Form", "Link sent"], "default": "Form"}, "$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this, st = this.state || {}, p = this.props;
    var s = st.s || (p.state ?? 'Form'); return { form: s === 'Form', sent: s === 'Link sent', send: function () { self.setState({ s: 'Link sent' }); } };
  }
}
</script>
</body>
</html>
