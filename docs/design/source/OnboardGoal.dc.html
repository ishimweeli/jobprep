</helmet>
<div style="min-height: 930px; background: #EFF3F8; font-family: Inter, system-ui, sans-serif; color: #3A3F4A; box-sizing: border-box; padding: 20px 24px 64px; position: relative"><a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 10px; text-decoration: none; align-self: flex-start"><span style="width: 34px; height: 34px; border-radius: 9px; background: #164A7A; display: flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span style="font-size: 18px; font-weight: 700; color: #164A7A">JobPrep</span></a><main style="max-width: 448px; margin: 48px auto 0; display: flex; flex-direction: column; gap: 22px"><div aria-label="Step 3 of 3" style="display: flex; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #2D62CF"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #2D62CF"></span><span style="width: 24px; height: 8px; border-radius: 4px; background: #2D62CF"></span></div><div style="display: flex; flex-direction: column; gap: 8px"><a href="OnboardCategory.dc.html" style="display: inline-flex; align-items: center; gap: 6px; font-size: 16px; text-decoration: none; align-self: flex-start; min-height: 32px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>Back</a><h1 style="margin: 0; font-size: 34px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em">Which position?</h1><p style="margin: 0; font-size: 16px; line-height: 1.5; color: #5E6573">We’ll recommend your first mock test.</p></div><div style="background: #fff; border: 1px solid #E2E7EF; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 16px"><fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px"><legend style="font-size: 14px; font-weight: 600; padding: 0; margin-bottom: 10px">Level</legend><div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{levels}}" as="o" hint-placeholder-count="4"><button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: {{o.border}}; background: {{o.bg}}; color: {{o.ink}}; font: 600 14px Inter, system-ui, sans-serif; cursor: pointer">{{o.t}}</button></sc-for></div></fieldset><fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px"><legend style="font-size: 14px; font-weight: 600; padding: 0; margin-bottom: 10px">Subject</legend><div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{subjects}}" as="o" hint-placeholder-count="8"><button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: {{o.border}}; background: {{o.bg}}; color: {{o.ink}}; font: 600 14px Inter, system-ui, sans-serif; cursor: pointer">{{o.t}}</button></sc-for></div></fieldset><div style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><label for="od" style="font-size: 14px; font-weight: 600">Exam date (optional)</label><input id="od" type="text" placeholder="e.g. 14 Dec 2026" style="height: 48px; border: 1px solid #CDD4DE; border-radius: 12px; padding: 0 14px; font: 400 16px Inter, system-ui, sans-serif; color: #3A3F4A; box-sizing: border-box; width: 100%; min-width: 0; background: #fff"></div></div><sc-if value="{{fromPaid}}" hint-placeholder-val="{{ false }}"><div role="note" style="background: #E8EFFB; border: 1px solid #DCEBFA; border-radius: 12px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.5; color: #164A7A"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 1px"><path d="M3 6h18v13H3z M3 10h18"></path></svg><span>{{fromPaidText}}</span></div></sc-if><a href="{{finishHref}}" style="width: 100%; justify-content: center; height: 50px; padding: 0 14px; border-radius: 12px; background: #164A7A; color: #fff; border: 0; font: 600 16px Inter, system-ui, sans-serif; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; text-decoration: none; box-sizing: border-box; cursor: pointer">{{finishLabel}}</a><div style="display: flex; justify-content: center"><a href="DashboardNew.dc.html" style="height: 44px; padding: 0 14px; border-radius: 10px; color: #2D62CF; font: 600 14px Inter, system-ui, sans-serif; display: inline-flex; align-items: center; text-decoration: none">Skip for now</a></div></main></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 930}, "continueTo": {"editor": "enum", "options": ["Dashboard", "Payment for the test they chose"], "default": "Dashboard"}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this, st = this.state || {}, p = this.props;
    var __paid = (p.continueTo ?? 'Dashboard') !== 'Dashboard';
    function mk(list, key, cur) { return list.map(function (t) { var on = t === cur; var o = {}; return { t: t, pressed: on ? 'true' : 'false', border: on ? '1px solid #2D62CF' : '1px solid #DCE2EB', bg: on ? '#E8EFFB' : '#fff', ink: on ? '#164A7A' : '#3A3F4A', pick: function () { o[key] = t; self.setState(o); } }; }); }
    return { fromPaid: __paid, fromPaidText: 'Next: payment for Accountant (Public Institution) — Mock 1. You can change these choices later.', finishHref: __paid ? 'Checkout.dc.html' : 'DashboardNew.dc.html', finishLabel: __paid ? 'Finish and continue to payment' : 'Finish setup', levels: mk(['Primary', 'Secondary (S1–S3)', 'Secondary (S4–S6)', 'TVET'], 'lv', st.lv || 'Secondary (S1–S3)'),
      subjects: mk(['Mathematics', 'English', 'Kinyarwanda', 'Physics', 'Chemistry', 'Biology', 'ICT', 'Teaching profession only'], 'sb', st.sb || 'Mathematics') };
  }
}
</script>
