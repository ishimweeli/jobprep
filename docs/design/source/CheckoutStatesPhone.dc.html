<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JobPrep — Checkout edge states on phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EFF3F8}
*{box-sizing:border-box}
a{color:#2D62CF}a:hover{color:#1E4BA8}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #6AA6EE;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; position: relative; display: flex; flex-direction: column; background: #EFF3F8; font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; color: #3A3F4A"><header style="flex: 0 0 auto; background: #FFFFFF; border-bottom: 1px solid #E2E7EF; padding: 8px 16px; display: flex; align-items: center; gap: 8px; min-height: 60px"><a href="DashboardNewPhone.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -12px; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; color: #3A3F4A; font-size: 20px">←</a><span style="font-weight: 700; font-size: 17px; flex: 1 1 auto">Get Full Access</span></header><main style="flex: 1 1 auto; overflow-y: auto; padding: 18px 16px; display: flex; flex-direction: column; gap: 16px"><section aria-label="Order summary" style="background: #FFFFFF; border: 1px solid #E2E7EF; border-radius: 16px; padding: 16px; display: flex; justify-content: space-between; gap: 10px">
  <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; font-size: 16px">JobPrep Full Access · Rwanda</span><span style="font-size: 14px; color: #3A3F4A">Every Rwanda mock test · 30 days</span></span>
  <span style="font-weight: 800; font-size: 16px; white-space: nowrap; font-variant-numeric: tabular-nums">[PRICE]</span>
</section><sc-if value="{{isForm}}" hint-placeholder-val="{{ true }}">
  <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
    <legend style="font-weight: 700; font-size: 16px; padding: 0; margin-bottom: 10px">Pay with</legend>
    <div style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 10px 14px; border-radius: 14px; border: 2px solid #164A7A; background: #E8EFFB"><span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 8px; background: #FFCB05"></span><span style="flex: 1 1 auto; font-weight: 700">MTN MoMo</span><span style="font-size: 13px; color: #5E6573">Selected</span></div>
    <div style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 10px 14px; border-radius: 14px; border: 1px solid #DCE2EB; background: #FFFFFF"><span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 8px; background: #E40000"></span><span style="flex: 1 1 auto; font-weight: 700">Airtel Money</span></div>
  </fieldset>
  <div style="display: flex; flex-direction: column; gap: 6px">
    <label for="ce-tel" style="font-weight: 700; font-size: 16px">Mobile Money number</label>
    <input id="ce-tel" type="tel" inputmode="numeric" value="{{f.val}}" aria-invalid="true" aria-describedby="ce-err" style="height: 52px; border: 1px solid #CDD4DE; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 17px; color: #3A3F4A; background: #FFFFFF; min-width: 0; border: 2px solid #A1281B">
    <p id="ce-err" role="alert" style="margin: 0; font-size: 14px; color: #A1281B; font-weight: 600">{{f.err}}</p>
    <sc-if value="{{f.hasFix}}" hint-placeholder-val="{{ false }}"><button type="button" style="align-self: flex-start; font: inherit; font-weight: 600; font-size: 14px; color: #2D62CF; background: transparent; border: 0; padding: 8px 0; cursor: pointer">{{f.fix}}</button></sc-if>
  </div>
  <button type="button" disabled style="font: inherit; font-weight: 700; font-size: 16px; min-height: 52px; border-radius: 12px; border: 0; background: #164A7A; color: #FFFFFF; cursor: pointer; text-align: center; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; padding: 0 20px; opacity: 0.45; cursor: not-allowed">Pay [PRICE]</button>
</sc-if>
<sc-if value="{{isResult}}" hint-placeholder-val="{{ false }}">
  <section role="status" style="background: #FFFFFF; border: 1px solid #E2E7EF; border-radius: 16px; padding: 24px 18px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px">
    <span style="width: 64px; height: 64px; border-radius: 999px; background: {{r.iconBg}}; color: {{r.iconInk}}; display: inline-flex; align-items: center; justify-content: center"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.icon}}"></path></svg></span>
    <h1 style="margin: 0; font-size: 22px">{{r.title}}</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #3A3F4A">{{r.body}}</p>
    <sc-if value="{{r.notCharged}}" hint-placeholder-val="{{ true }}"><p style="margin: 0; font-size: 15px; font-weight: 700; color: #3A3F4A">You were not charged.</p></sc-if>
  </section>
  <a href="{{r.href}}" style="font: inherit; font-weight: 700; font-size: 16px; min-height: 52px; border-radius: 12px; border: 0; background: #164A7A; color: #FFFFFF; cursor: pointer; text-align: center; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; padding: 0 20px">{{r.cta}}</a>
  <sc-if value="{{r.hasAlt}}" hint-placeholder-val="{{ true }}"><a href="{{r.altHref}}" style="text-align: center; font-weight: 600; font-size: 15px; padding: 10px">{{r.alt}}</a></sc-if>
</sc-if></main></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state": {"editor": "enum", "options": ["Invalid number", "Number on another network", "Declined", "Expired", "Provider unavailable", "Still pending", "Already have access"], "default": "Invalid number"}, "checkoutHref": {"editor": "text", "default": "Checkout.dc.html"}, "homeHref": {"editor": "text", "default": "DashboardNewPhone.dc.html"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {

    var F = {
      'Invalid number': { val: '78812', err: 'Enter a 9-digit Rwanda number, like 788 123 456.', hasFix: false },
      'Number on another network': { val: '723 455 219', err: 'This looks like an Airtel number. MTN MoMo numbers start with 078 or 079.', hasFix: true, fix: 'Pay with Airtel Money instead' }
    };
    var R = {
      'Declined': { icon: X, iconBg: '#FBE7E4', iconInk: '#A1281B', title: 'Payment declined', body: 'MTN MoMo declined the request. This can happen if the PIN was wrong or the balance was too low.', notCharged: true, cta: 'Try again', href: (p.checkoutHref ?? 'Checkout.dc.html'), hasAlt: true, alt: 'Pay with Airtel Money instead', altHref: (p.checkoutHref ?? 'Checkout.dc.html') },
      'Expired': { icon: CLOCK, iconBg: '#FDF1DD', iconInk: '#8A5300', title: 'The request expired', body: 'The prompt on +250 788 123 456 was not approved in time, so we cancelled it.', notCharged: true, cta: 'Send a new prompt', href: (p.checkoutHref ?? 'Checkout.dc.html'), hasAlt: true, alt: 'Use a different number', altHref: (p.checkoutHref ?? 'Checkout.dc.html') },
      'Provider unavailable': { icon: WARN, iconBg: '#FDF1DD', iconInk: '#8A5300', title: 'MTN MoMo is not responding', body: 'We could not reach MTN MoMo just now. Try again in a few minutes, or pay with Airtel Money.', notCharged: true, cta: 'Pay with Airtel Money', href: (p.checkoutHref ?? 'Checkout.dc.html'), hasAlt: true, alt: 'Try MTN MoMo again', altHref: (p.checkoutHref ?? 'Checkout.dc.html') },
      'Still pending': { icon: HOUR, iconBg: '#E8EFFB', iconInk: '#164A7A', title: 'Still waiting for confirmation', body: 'You approved the payment, but MTN MoMo has not confirmed it to us yet. This usually takes under a minute. If you were charged and access does not appear within 10 minutes, contact [SUPPORT PHONE] with your MoMo transaction ID.', notCharged: false, cta: 'Check again', href: (p.checkoutHref ?? 'Checkout.dc.html'), hasAlt: true, alt: 'Go to my dashboard', altHref: (p.homeHref ?? 'DashboardNewPhone.dc.html') },
      'Already have access': { icon: OK, iconBg: '#E3F4E8', iconInk: '#1E6B3C', title: 'You already have Full Access', body: 'Your Rwanda Full Access runs until 24 Nov 2026, so there is nothing to pay. You can add 30 more days from your dashboard when it is close to ending.', notCharged: false, cta: 'Start a mock test', href: (p.homeHref ?? 'DashboardNewPhone.dc.html'), hasAlt: false }
    };
    var isForm = !!F[s];
    return { isForm: isForm, isResult: !isForm, f: F[s] || F['Invalid number'], r: R[s] || R['Declined'] };
  }
}
</script>
</body>
</html>
