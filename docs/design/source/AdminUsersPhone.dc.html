<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JobPrep Admin — Users on phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#2D62CF}a:hover{color:#1E4BA8}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #6AA6EE;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #EFF3F8; font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; color: #3A3F4A">
  <header style="flex: 0 0 auto; background: #FFFFFF; border-bottom: 1px solid #E2E7EF; padding: 8px 16px 10px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 10px; min-height: 44px">
      <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#164A7A"></rect><path d="M9 16.5l4.5 4.5L23 11" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <h1 style="margin: 0; font-size: 19px; flex: 1 1 auto">Users</h1>
      <span style="font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 6px; background: #182231; color: #FFFFFF">ADMIN</span>
    </div>
    <input type="search" aria-label="Search name or phone" value="{{q}}" onInput="{{onQ}}" placeholder="Search name or phone" style="height: 46px; border: 1px solid #CDD4DE; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 16px; color: #3A3F4A; background: #FFFFFF">
    <div role="group" aria-label="Access status" style="display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 2px">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
        <button type="button" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="flex: 0 0 auto; font: inherit; font-size: 14px; font-weight: 600; min-height: 40px; padding: 0 14px; border-radius: 999px; border: {{f.border}}; background: {{f.bg}}; color: {{f.ink}}">{{f.label}}</button>
      </sc-for>
    </div>
  </header>
  <main style="flex: 1 1 auto; overflow-y: auto; padding: 14px 16px 20px; display: flex; flex-direction: column; gap: 14px">
    <span style="font-size: 13px; color: #5E6573; font-weight: 600">{{countLabel}}</span>
    <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; padding: 24px; text-align: center; color: #3A3F4A; background: #FFFFFF; border: 1px dashed #CDD4DE; border-radius: 14px">No users match.</p></sc-if>
    <sc-for list="{{rows}}" as="u" hint-placeholder-count="6">
      <a href="AdminUserPhone.dc.html" style="display: flex; gap: 12px; align-items: center; background: #FFFFFF; border: 1px solid #E2E7EF; border-radius: 14px; padding: 12px 14px; text-decoration: none; color: #3A3F4A">
        <span style="flex: 0 0 auto; width: 40px; height: 40px; border-radius: 999px; background: #E8EFFB; color: #164A7A; font-weight: 800; font-size: 14px; display: inline-flex; align-items: center; justify-content: center">{{u.init}}</span>
        <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-weight: 700; font-size: 15px">{{u.name}}</span>
          <span style="font-size: 13px; color: #5E6573">{{u.phone}} · {{u.last}}</span>
        </span>
        <span style="font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: {{u.aBg}}; color: {{u.aInk}}; white-space: nowrap">{{u.access}}</span>
      </a>
    </sc-for>
  </main>
  <nav aria-label="Admin" style="flex: 0 0 auto; position: sticky; bottom: 0; background: #FFFFFF; border-top: 1px solid #E2E7EF; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 4px 2px 8px">
    <a href="AdminOverviewPhone.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #5E6573; font-size: 11px; font-weight: 600; padding: 6px 0; min-height: 52px"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h8V3H3z M13 21h8V11h-8z M3 21h8v-6H3z M13 9h8V3h-8z"></path></svg>Overview</a>
    <a href="AdminUsersPhone.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #164A7A; font-size: 11px; font-weight: 700; padding: 6px 0; min-height: 52px"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M22 21v-2a4 4 0 0 0-3-3.9"></path></svg>Users</a>
    <a href="AdminExamsPhone.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #5E6573; font-size: 11px; font-weight: 600; padding: 6px 0; min-height: 52px"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6v3H9z M7 5H5v16h14V5h-2 M8 11h8 M8 15h5"></path></svg>Exams</a>
    <a href="AdminPaymentsPhone.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #5E6573; font-size: 11px; font-weight: 600; padding: 6px 0; min-height: 52px"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18v13H3z M3 10h18"></path></svg>Payments</a>
    <a href="AdminSettingsPhone.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #5E6573; font-size: 11px; font-weight: 600; padding: 6px 0; min-height: 52px"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M12 2v3 M12 19v3 M4.2 4.2l2.1 2.1 M17.7 17.7l2.1 2.1 M2 12h3 M19 12h3 M4.2 19.8l2.1-2.1 M17.7 6.3l2.1-2.1"></path></svg>Settings</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { q: '', f: 'all' }; }
  renderVals() {
    var self = this, st = this.state || {};
    var A = { active: ['Full Access', '#E8EFFB', '#164A7A'], free: ['Free', '#EEF1F5', '#3A3F4A'], expired: ['Expired', '#FDF1DD', '#8A5300'], suspended: ['Suspended', '#FBE7E4', '#A1281B'] };
    var users = [
      ['Aline Uwase', '078 812 3456', 'active', 'Today 21:14'], ['Eric Habimana', '073 455 2190', 'free', 'Today 21:05'],
      ['Diane Mukamana', '079 301 7744', 'active', 'Today 20:58'], ['Patrick Nshimiye', '078 990 1203', 'free', 'Today 20:41'],
      ['Claudine Ingabire', '078 544 8810', 'active', 'Today 20:37'], ['Jean Claude Mugisha', '072 118 6620', 'expired', '29 Oct'],
      ['Grace Uwimana', '079 663 0045', 'active', 'Yesterday'], ['Samuel Niyonzima', '078 220 3391', 'suspended', '27 Oct']
    ];
    var q = (st.q || '').toLowerCase().replace(/\s/g, ''), f = st.f || 'all';
    var rows = users.filter(function (u) {
      if (f !== 'all' && u[2] !== f) return false;
      return !q || (u[0] + u[1]).toLowerCase().replace(/\s/g, '').indexOf(q) >= 0;
    }).map(function (u) {
      var a = A[u[2]];
      return { name: u[0], phone: u[1], last: u[3], access: a[0], aBg: a[1], aInk: a[2], init: u[0].split(' ').map(function (w) { return w[0]; }).slice(0, 2).join('') };
    });
    var filters = [['all', 'All'], ['active', 'Full Access'], ['free', 'Free'], ['expired', 'Expired'], ['suspended', 'Suspended']].map(function (x) {
      var on = f === x[0];
      return { label: x[1], pressed: on ? 'true' : 'false', border: on ? '1px solid #182231' : '1px solid #DCE2EB', bg: on ? '#182231' : '#FFFFFF', ink: on ? '#FFFFFF' : '#3A3F4A',
        pick: function () { self.setState({ f: x[0] }); } };
    });
    return { rows: rows, filters: filters, q: st.q || '', empty: rows.length === 0,
      countLabel: f === 'all' && !q ? '4,218 users · showing latest' : rows.length + ' matching',
      onQ: function (e) { self.setState({ q: e.target.value }); } };
  }
}
</script>
</body>
</html>
