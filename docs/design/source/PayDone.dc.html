<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JobPrep — Payment confirmed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#6D28D9}a:hover{color:#5B21B6}
a:focus-visible{outline:3px solid #A78BFA;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #FAFAFA; font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; color: #18181B">
  <main style="flex: 1 1 auto; overflow-y: auto; padding: 40px 16px 18px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px">
      <span style="width: 72px; height: 72px; border-radius: 999px; background: #D1FAE5; display: inline-flex; align-items: center; justify-content: center">
        <svg width="36" height="36" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#047857" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
      </span>
      <h1 style="margin: 0; font-size: 26px; letter-spacing: -0.02em">Payment confirmed</h1>
      <p style="margin: 0; font-size: 16px; color: #3F3F46; line-height: 1.5">Full Access is active. Every mock test on JobPrep is unlocked for 30 days.</p>
    </div>

    <dl style="margin: 0; background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 16px; padding: 4px 16px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
        <div style="display: flex; justify-content: space-between; gap: 10px; padding: 12px 0; border-bottom: 1px solid #F4F4F5; font-size: 15px">
          <dt style="color: #52525B">{{r.k}}</dt><dd style="margin: 0; font-weight: 600; text-align: right">{{r.v}}</dd>
        </div>
      </sc-for>
    </dl>

    <p style="margin: 0; font-size: 13px; color: #52525B; text-align: center">A receipt was sent by SMS to 078 812 3456.</p>
  </main>
  <footer style="flex: 0 0 auto; background: #FFFFFF; border-top: 1px solid #E4E4E7; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 8px">
    <a href="CaseExam.dc.html" style="text-align: center; text-decoration: none; background: #6D28D9; color: #FFFFFF; font-weight: 700; font-size: 17px; padding: 16px; border-radius: 14px">Start Mock 1 now</a>
    <a href="Dashboard.dc.html" style="text-align: center; text-decoration: none; color: #18181B; font-weight: 600; font-size: 15px; padding: 12px">Go to My progress</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { rows: [
      { k: 'Package', v: 'Full Access · 30 days' },
      { k: 'Amount', v: 'RWF 2,000' },
      { k: 'Paid with', v: 'MTN MoMo' },
      { k: 'Access until', v: '1 Dec 2026' },
      { k: 'Transaction ID', v: 'JP-26110-48213' }
    ] };
  }
}
</script>
</body>
</html>
