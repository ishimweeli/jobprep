<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JobPrep — System pages</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EFF3F8}
*{box-sizing:border-box}
a{color:#2D62CF}a:hover{color:#1E4BA8}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #6AA6EE;outline-offset:2px}
</style>
</helmet>
<div style="font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; color: #3A3F4A; background: #EFF3F8; min-height: 100vh; position: relative; display: flex; flex-direction: column"><header style="border-bottom: 1px solid #E2E7EF; background: #FFFFFF">
  <div style="max-width: 1200px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #3A3F4A; font-weight: 700; font-size: 20px; letter-spacing: -0.02em"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#164A7A"></rect><path d="M9 16.5l4.5 4.5L23 11" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>JobPrep</a>
    <nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 4px 22px; flex: 1 1 auto; font-size: 15px"><a href="Catalog.dc.html" style="color: #3A3F4A; font-weight: 500; text-decoration: none; padding: 10px 0;">Mock tests</a><a href="Pricing.dc.html" style="color: #3A3F4A; font-weight: 500; text-decoration: none; padding: 10px 0;">Pricing</a></nav>
    <div style="display: flex; gap: 10px; align-items: center"><a href="CountryPicker.dc.html" aria-label="Country: Rwanda. Change country" style="display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: #3A3F4A; font-weight: 600; font-size: 14px; border: 1px solid #DCE2EB; border-radius: 999px; padding: 8px 12px"><span style="background: #EFF3F8; color: #5E6573; border: 1px solid #E2E7EF; border-radius: 4px; padding: 1px 5px; font-size: 11px; font-weight: 600">RW</span>Rwanda</a><a href="SignIn.dc.html" style="color: #3A3F4A; text-decoration: none; font-weight: 600; font-size: 15px; padding: 12px 14px">Sign in</a><a href="SignUp.dc.html" style="background: #164A7A; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 15px; padding: 12px 18px; border-radius: 999px">Create account</a></div>
  </div>
</header><main style="flex: 1 1 auto; padding: 72px 16px; display: flex; justify-content: center; align-items: flex-start"><div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; max-width: 460px; width: 100%">
  <span style="width: 72px; height: 72px; border-radius: 999px; background: #EEF1F5; color: #3A3F4A; display: inline-flex; align-items: center; justify-content: center"><svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{x.icon}}"></path></svg></span>
  <sc-if value="{{x.hasCode}}" hint-placeholder-val="{{ false }}"><span style="font-size: 14px; font-weight: 600; color: #5E6573">{{x.code}}</span></sc-if>
  <h1 style="margin: 0; font-size: 28px; letter-spacing: -0.02em; line-height: 1.2">{{x.title}}</h1>
  <p style="margin: 0; font-size: 16px; color: #3A3F4A; line-height: 1.55">{{x.body}}</p>
  <sc-if value="{{x.hasNote}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; font-size: 14px; color: #1E6B3C; background: #E3F4E8; border-radius: 10px; padding: 10px 14px; font-weight: 600">{{x.note}}</p></sc-if>
  <div style="display: flex; flex-direction: column; gap: 8px; width: 100%">
    <a href="{{x.href}}" style="font: inherit; font-weight: 600; font-size: 16px; min-height: 44px; border-radius: 10px; border: 0; background: #164A7A; color: #FFFFFF; cursor: pointer; text-align: center; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; padding: 0 20px">{{x.cta}}</a>
    <sc-if value="{{x.hasAlt}}" hint-placeholder-val="{{ true }}"><a href="{{x.altHref}}" style="font-weight: 600; font-size: 15px; padding: 10px">{{x.alt}}</a></sc-if>
  </div>
  <sc-if value="{{x.hasRef}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; font-size: 12px; color: #5E6573">Reference: {{x.ref}} — share this with support if it keeps happening.</p></sc-if>
</div></main></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"page": {"editor": "enum", "options": ["404 not found", "Something went wrong", "Maintenance", "Session expired"], "default": "404 not found"}, "$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this, st = this.state || {}, p = this.props;
    var s = p.page ?? '404 not found';
    var H = p.home ?? 'Main.dc.html', T = p.tests ?? 'Catalog.dc.html', SI = p.signin ?? 'SignIn.dc.html';
    var X = {
      '404 not found': { icon: 'M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z M21 21l-4.3-4.3 M8 11h6', hasCode: true, code: 'Error 404', title: 'We can’t find that page', body: 'The link may be old, or the mock test may have been moved. Search for your exam instead.', cta: 'Find mock tests', href: T, hasAlt: true, alt: 'Go to the home page', altHref: H },
      'Something went wrong': { icon: 'M12 9v4 M12 17h.01 M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z', hasCode: false, title: 'Something went wrong on our side', body: 'This is our fault, not yours. Try again in a moment.', hasNote: true, note: 'If you were taking a test, your answers are saved.', cta: 'Try again', href: '#', hasAlt: true, alt: 'Go to the home page', altHref: H, hasRef: true, ref: 'JP-7F3A-21C9' },
      'Maintenance': { icon: 'M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9z', hasCode: false, title: 'JobPrep is being updated', body: 'We’re making improvements and expect to be back by [TIME]. Your results, answers and access are safe.', hasNote: false, cta: 'Check again', href: '#', hasAlt: false },
      'Session expired': { icon: 'M7 11V7a5 5 0 0 1 10 0v4 M5 11h14v10H5z', hasCode: false, title: 'Please sign in again', body: 'For your security, you were signed out after a long time without activity.', hasNote: true, note: 'Your answers and results are saved.', cta: 'Sign in', href: SI, hasAlt: true, alt: 'Go to the home page', altHref: H }
    };
    var x = X[s]; x.hasNote = !!x.hasNote; x.hasRef = !!x.hasRef; return { x: x };
  }
}
</script>
</body>
</html>
