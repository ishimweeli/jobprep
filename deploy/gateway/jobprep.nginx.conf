# Gateway pieces for JobPrep (Netcup's nginx, /opt/lb/nginx.conf). Not applied by CI: they are added to the
# gateway by hand once, then kept in step by gen-nginx-configs.py (see docs/DEPLOY.md, "Gateway").

# ---- 1. inside `http { }`, next to the other upstream blocks (this is the `both` / normal mode) -------------
upstream jobprep_pool {
    server 127.0.0.1:18300 weight=1 max_fails=1 fail_timeout=3s;      # Netcup, 1 replica
    server 10.10.10.2:18300 weight=5 max_fails=1 fail_timeout=3s;     # Contabo replica 1
    server 10.10.10.2:18301 weight=5 max_fails=1 fail_timeout=3s;     # Contabo replica 2
}

# ---- 2. inside `http { }`, next to the other server blocks -----------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name jobprep.nexvecta.com;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jobprep.nexvecta.com;
    ssl_certificate /etc/letsencrypt/live/jobprep.nexvecta.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobprep.nexvecta.com/privkey.pem;

    location / {
        proxy_pass http://jobprep_pool;
        # Retry the other replica if one is down or mid-restart. nginx does not retry POST/PATCH by default,
        # so a payment or exam submission is never sent twice.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_connect_timeout 1s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
