name: Daily content from MIFOTRA

# Every day at 06:00 Kigali (04:00 UTC): read the open MIFOTRA adverts, write the missing mocks with the Claude Agent
# SDK (through OpenRouter), validate them with prisma/pipeline/check.ts, commit them to main, add them to production
# and email a status report (see apps/api/prisma/pipeline/run-daily.ts).
#
# Runs on the netcup server's runner, which reads OPENROUTER_API_KEY and the MAIL_* account from /opt/jobprep/.env.
# Run it by hand from the Actions tab; tick "dry run" to write and check without saving or publishing.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: write and check only, no commit and no production sync (the report is still emailed)'
        type: boolean
        default: false

concurrency:
  group: daily-content
  cancel-in-progress: false

jobs:
  daily:
    runs-on: [self-hosted, netcup]
    timeout-minutes: 330
    permissions:
      contents: write
    env:
      REPORT_TO: ishimweeliab0@gmail.com
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Not --omit=optional: the Agent SDK ships its Claude Code binary as an optional dependency.
      - run: npm ci
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - name: Read the OpenRouter key from /opt/jobprep/.env
        run: |
          key=$(grep -E '^OPENROUTER_API_KEY=' /opt/jobprep/.env | tail -1 | cut -d= -f2- | tr -d "\r\"'")
          if [ -z "$key" ]; then echo "OPENROUTER_API_KEY is missing from /opt/jobprep/.env" >&2; exit 1; fi
          echo "::add-mask::$key"
          echo "ANTHROPIC_AUTH_TOKEN=$key" >> "$GITHUB_ENV"
      - name: Scan MIFOTRA, write and check the missing mocks
        working-directory: apps/api
        env:
          ANTHROPIC_BASE_URL: https://openrouter.ai/api
          ANTHROPIC_API_KEY: ''
          PIPELINE_DRY_RUN: ${{ env.DRY_RUN }}
        run: npx tsx prisma/pipeline/run-daily.ts "$RUNNER_TEMP/pipeline"
      - name: Typecheck and lint the new content
        if: env.DRY_RUN != 'true'
        run: npm run typecheck && npm run lint
      - name: Commit and push
        id: commit
        if: env.DRY_RUN != 'true'
        run: |
          if [ -z "$(git status --porcelain -- apps/api/prisma)" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/api/prisma
          git commit -m "Daily content from MIFOTRA ($(date -u +%F))"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Build image
        if: always()
        run: docker build -t jobprep:daily .
      - name: Add the new content to production (additive only, see apps/api/prisma/sync-content.ts)
        id: sync
        if: steps.commit.outputs.changed == 'true'
        run: >
          docker run --rm --add-host host.docker.internal:host-gateway
          --env-file /opt/jobprep/migrate.env jobprep:daily npx tsx prisma/sync-content-cli.ts
      - name: Email the status report
        if: always()
        run: >
          docker run --rm --add-host host.docker.internal:host-gateway
          --env-file /opt/jobprep/.env
          -e REPORT_TO="$REPORT_TO"
          -e SYNC_STATUS="${{ steps.commit.outputs.changed == 'true' && steps.sync.outcome || 'skipped' }}"
          -e WRITE_STATUS="${{ job.status }}"
          -v "$RUNNER_TEMP/pipeline:/report:ro"
          jobprep:daily npx tsx prisma/pipeline/report.ts /report/report.json
